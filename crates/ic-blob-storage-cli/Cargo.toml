[package]
name = "ic-blob-storage-cli"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

# Tooling selects the installed payload; it is not linked into CLI behavior tests.
[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[[bin]]
name = "blob"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ic-blob-storage.workspace = true
ic-host-fs.workspace = true
ic-platform = { workspace = true, features = ["agent", "candid-codec", "ic-protocol", "management-canister-types"] }
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
url.workspace = true

[lints]
workspace = true
