[package]
name = "ic-blob-storage-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Runtime-free wire contracts and content verification for IC Blob Storage"
readme = "README.md"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ic-host-artifacts.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["candid-service"] }

[features]
# Provider JSON codecs are opt-in; the default contract graph stays minimal.
provider-json = ["dep:serde_json"]
# Host metadata is never required by mounted canisters.
wire-schema = ["ic-wire/typescript", "ic-platform/wire-schema", "dep:serde_json"]

[dependencies]
ic-platform = { workspace = true, features = ["candid"] }
ic-wire.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true

[[example]]
name = "prepare_upload"
path = "examples/prepare_upload/main.rs"
test = true

[[example]]
name = "verify_download"
path = "examples/verify_download/main.rs"
test = true

[[example]]
name = "wire_schema"
path = "examples/wire_schema/main.rs"
required-features = ["wire-schema"]

[lints]
workspace = true
