[package]
name = "ic-blob-storage-reference-app"
version.workspace = true
description = "Experimental reference application and Wire protocol for ic-blob-storage"
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }

[dependencies]
ic-blob-storage.workspace = true
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
