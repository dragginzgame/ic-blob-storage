[package]
name = "ic-blob-storage"
build = "build/main.rs"
version.workspace = true
description = "Experimental blob authorization, application references and provider-obligation accounting for the Internet Computer"
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
caffeine-certificate = ["dep:ic-platform-protocol"]
inspection = [
    "dep:proc-macro2",
    "dep:quote",
    "dep:syn",
    "dep:serde_json",
    "ic-wire/derive",
    "ic-wire/platform-types",
]
logging = ["dep:ic-logging"]
metrics = ["dep:ic-metrics"]

[dependencies]
ic-logging = { workspace = true, optional = true }
ic-metrics = { workspace = true, optional = true }
ic-platform-protocol = { workspace = true, features = ["caffeine"], optional = true }
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true

serde_json = { workspace = true, optional = true }

[build-dependencies]
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, features = ["full", "visit"], optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
