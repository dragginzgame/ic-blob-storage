[package]
name = "ic-blob-storage-tests"
version = "0.100.5"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
build = "build/main.rs"

[package.metadata.toko-tooling.loc]
category = "tests"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
api-manifest = [
    "dep:proc-macro2",
    "dep:quote",
    "dep:syn",
    "ic-wire/api-manifest",
    "ic-wire/derive",
    "ic-wire/platform-types",
]

[dependencies]
ic-blob-storage.workspace = true
ic-host-process.workspace = true
ic-platform = { workspace = true, features = ["native-signed"] }
ic-platform-types.workspace = true
ic-testkit = { workspace = true, features = ["held-reply-fixtures", "managed-server"] }
ic-wire.workspace = true
tokio.workspace = true

[build-dependencies]
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, features = ["full", "visit"], optional = true }

[dev-dependencies]
clap.workspace = true
ic-blob-storage-enrollment-probe.workspace = true
ic-blob-storage-reference-app.workspace = true
ic-host-artifacts = { workspace = true, features = ["canister-methods"] }
ic-host-fs.workspace = true
ic-platform-protocol = { workspace = true, features = ["caffeine", "management"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toko-tooling.workspace = true
wat.workspace = true

[[example]]
name = "callable-api"
required-features = ["api-manifest"]

[[test]]
name = "callbacks"
path = "tests/callbacks/mod.rs"

[[test]]
name = "management"
path = "tests/management/mod.rs"

[lints]
workspace = true
