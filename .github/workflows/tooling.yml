name: Release and formatting tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare fixture utilities on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xz-utils libdigest-sha-perl shellcheck
      - name: Prepare fixture utilities on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep xz shellcheck
      - name: Prepare the selected Rust and formatter tools
        run: |
          rustup show active-toolchain
          source ci/tool-versions.env
          cargo install cargo-sort --version "$SHARED_TOOLING_CARGO_SORT_VERSION" \
            --locked --root "$RUNNER_TEMP/blob-format-tools"
          echo "$RUNNER_TEMP/blob-format-tools/bin" >> "$GITHUB_PATH"
      - name: Prepare and verify reviewed repository-local executables
        run: |
          make install-tools
          make tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Check the snapshot, formatter and release/hook fixtures
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: |
          /bin/bash --version
          make shared-tooling-check
          failed=0
          for target in tools-check release-tools-check dependency-pins-check documentation-links-check shared-tooling-tests evidence-check fmt-check release-check hooks-check; do
            if make "$target"; then :; else failed=1; fi
          done
          exit "$failed"
      - name: Prepare the locked native dependency cache
        run: make deps
      - name: Qualify native CLI boundaries and local PocketIC installation
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: make test-native-host
      - name: Retain failed tooling fixtures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-failure-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .tools/host-set.*/
            .tools/ic-set.*/
            target/release-tests.*/
            ${{ runner.temp }}/blob-format-hooks.*/
            ${{ runner.temp }}/formatting-adoption.*/
            ${{ runner.temp }}/blob-evidence-checksums.*/
            ${{ runner.temp }}/nonempty-cargo-test.*
            ${{ runner.temp }}/file-digests.*/
            ${{ runner.temp }}/ic-tools-test.*/
            ${{ runner.temp }}/release-commands.*/
            ${{ runner.temp }}/cargo-metadata-test.*/
            ${{ runner.temp }}/shared-tooling-snapshot-test.*/
            ${{ runner.temp }}/local-lock-test.*/
            ${{ runner.temp }}/format-tools-test.*/
            ${{ runner.temp }}/blob-validation-logging.*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
