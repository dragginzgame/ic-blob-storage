[package]
name = "ic-blob-storage-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
candid.workspace = true
ic-agent = { workspace = true, features = ["pem"] }
ic-blob-storage-contracts.workspace = true
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
reqwest = { workspace = true, features = ["rustls", "http2"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "blob-storage"
path = "src/main.rs"

[[bin]]
name = "caffeine-probe"
path = "src/probe_main.rs"

[lints]
workspace = true
