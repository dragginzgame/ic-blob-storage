[workspace]
# Production packages: canisters/standalone and crates/*.
# Tests and tooling packages: canisters/test/*, tests/pocketic and tests/protocol.
members = [
    "canisters/standalone",
    "canisters/test/admission_probe",
    "canisters/test/authority_probe",
    "canisters/test/consumer_probe",
    "canisters/test/funding_probe",
    "canisters/test/gateway_source",
    "canisters/test/storage_probe",
    "crates/ic-blob-storage",
    "crates/ic-blob-storage-cli",
    "crates/ic-blob-storage-client",
    "crates/ic-blob-storage-contracts",
    "tests/pocketic",
    "tests/protocol",
]
resolver = "3"

[workspace.package]
version = "0.55.1"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-blob-storage"
publish = ["crates-io"]

[workspace.dependencies]
# Production dependencies
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
hex = "0.4.3"
ic-blob-storage = { path = "crates/ic-blob-storage" }
ic-blob-storage-client = { path = "crates/ic-blob-storage-client", version = "0.55.1" }
ic-blob-storage-contracts = { path = "crates/ic-blob-storage-contracts", version = "0.55.1", default-features = false }
ic-build = "0.69.11"
ic-host-artifacts = { version = "0.69.11", default-features = false }
ic-host-fs = { version = "0.69.11", default-features = false }
ic-host-http = { version = "0.69.11", default-features = false }
ic-host-process = { version = "0.69.11", default-features = false }
ic-memory = "0.55.0"
ic-metrics = "0.17.0"
ic-platform = { version = "0.7.6", default-features = false }
ic-storage = "0.55.0"
ic-wire = "0.7.19"
libc = "0.2.191"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
# PocketIC constrains its own thiserror dependency; the lock retains 2.0.18.
thiserror = "2.0.18"
tokio = "1.54.1"
url = "2.5.8"

# Tests and tooling only
blob-test-protocol = { path = "tests/protocol" }
ic-blob-storage-canister = { path = "canisters/standalone" }
ic-host-tools = { version = "0.69.11", default-features = false }
ic-testkit = "0.69.11"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# This workspace owns the standalone/probe products. Consumers keep their own
# release profiles; linking Blob does not select their optimization policy.
[profile.release]
lto = "thin"
codegen-units = 1
