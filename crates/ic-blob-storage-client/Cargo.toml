[package]
name = "ic-blob-storage-client"
version = "0.72.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded replicated IC Blob calls without service storage dependencies"
readme = "README.md"

[features]
# Native transport and private staging are excluded from every Wasm target.
native-download = ["dep:reqwest", "dep:ic-host-fs", "dep:tokio"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ic-host-fs = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls", "http2"] }
tokio = { workspace = true, optional = true, features = ["time"] }

[dependencies]
ic-blob-storage-contracts.workspace = true
ic-platform-runtime = { workspace = true, features = ["runtime"] }
ic-platform-types.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "time"] }

[lints]
workspace = true
