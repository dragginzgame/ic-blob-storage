[workspace]
members = [
    "crates/ic-blob-storage",
    "crates/ic-blob-storage-canister",
    "crates/ic-blob-storage-cli",
    "crates/ic-blob-storage-reference-app",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.114.0"
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-blob-storage"
publish = ["crates-io"]

[workspace.dependencies]
# Production
clap = { version = "4.6.7", features = ["derive"] }
ic-blob-storage = { version = "0.114.0", path = "crates/ic-blob-storage" }
ic-blob-storage-reference-app = { version = "0.114.0", path = "crates/ic-blob-storage-reference-app" }
ic-host-artifacts = { version = "0.80.3", default-features = false }
ic-host-fs = { version = "0.80.3", default-features = false }
ic-logging = { version = "0.26.0", default-features = false }
ic-metrics = { version = "0.30.23", default-features = false }
ic-platform = { version = "0.35.1", default-features = false }
ic-platform-protocol = { version = "0.3.11", default-features = false }
ic-platform-runtime = { version = "0.23.27", default-features = false }
ic-platform-types = { version = "0.21.6", default-features = false }
ic-storage = "0.80.0"
ic-wire = { version = "0.33.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "process"] }
url = "2.5.8"

proc-macro2 = "1.0.107"
quote = "1.0.47"
serde_json = "1.0.154"
syn = "3.0.10"

# Tests and tooling
toko-tooling = "=0.46.9"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"
