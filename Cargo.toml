[workspace]
members = [
    "canisters/standalone",
    "canisters/test/admission_probe",
    "canisters/test/authority_probe",
    "canisters/test/consumer_probe",
    "canisters/test/funding_probe",
    "canisters/test/gateway_source",
    "canisters/test/storage_probe",
    "crates/ic-blob-storage",
    "crates/ic-blob-storage-cli",
    "crates/ic-blob-storage-contracts",
    "tests/pocketic",
    "tests/protocol",
]
resolver = "3"

[workspace.package]
version = "0.20.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-blob-storage"
publish = ["crates-io"]

[workspace.dependencies]
blob-test-protocol = { path = "tests/protocol" }
candid = "0.10.36"
candid_parser = "0.4.1"
ic-agent = { version = "0.49.2", default-features = false }
ic-blob-storage = { path = "crates/ic-blob-storage" }
ic-blob-storage-canister = { path = "canisters/standalone" }
ic-blob-storage-contracts = { path = "crates/ic-blob-storage-contracts", version = "0.20.0" }
ic-cdk = "0.20.3"
ic-host-artifacts = "0.9"
ic-host-fs = "0.9"
ic-management-canister-types = "0.11.0"
ic-memory = "0.32"
ic-metrics = "0.3"
ic-testkit = "0.26"
libc = "0.2.190"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_cbor = "0.11.2"
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
# PocketIC constrains its own thiserror dependency; the lock retains 2.0.18.
thiserror = "2.0.18"
tokio = "1.53.1"
url = "2.5.8"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
