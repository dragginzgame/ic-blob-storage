[workspace]
# Production packages: canisters/standalone and crates/*.
# Tests and tooling packages: canisters/tests/*, tests/pocketic and tests/protocol.
members = [
    "canisters/standalone",
    "canisters/tests/admission_probe",
    "canisters/tests/authority_probe",
    "canisters/tests/consumer_probe",
    "canisters/tests/funding_probe",
    "canisters/tests/gateway_source",
    "canisters/tests/storage_probe",
    "crates/ic-blob-storage",
    "crates/ic-blob-storage-cli",
    "crates/ic-blob-storage-client",
    "crates/ic-blob-storage-contracts",
    "tests/pocketic",
    "tests/protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-blob-storage"
publish = ["crates-io"]

[workspace.dependencies]
# Contracts
# Changelog : releases/contracts/CHANGELOG.md
ic-blob-storage-contracts = { path = "crates/ic-blob-storage-contracts", version = "0.73.0", default-features = false }

# Client
# Changelog : releases/client/CHANGELOG.md
ic-blob-storage-cli = { path = "crates/ic-blob-storage-cli", version = "0.73.1" }
ic-blob-storage-client = { path = "crates/ic-blob-storage-client", version = "0.73.1" }

# Engine
# Changelog : releases/engine/CHANGELOG.md
blob-admission-probe = { path = "canisters/tests/admission_probe", version = "0.74.0" }
blob-authority-probe = { path = "canisters/tests/authority_probe", version = "0.74.0" }
blob-consumer-probe = { path = "canisters/tests/consumer_probe", version = "0.74.0" }
blob-funding-probe = { path = "canisters/tests/funding_probe", version = "0.74.0" }
blob-gateway-source = { path = "canisters/tests/gateway_source", version = "0.74.0" }
blob-storage-probe = { path = "canisters/tests/storage_probe", version = "0.74.0" }
blob-test-protocol = { path = "tests/protocol", version = "0.74.0" }
ic-blob-storage = { path = "crates/ic-blob-storage", version = "0.74.0" }
ic-blob-storage-canister = { path = "canisters/standalone", version = "0.74.0" }
ic-blob-storage-pocketic-tests = { path = "tests/pocketic", version = "0.74.0" }

# Production dependencies
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
hex = "0.4.3"
ic-build = "0.75.0"
ic-host-artifacts = { version = "0.74.1", default-features = false }
ic-host-fs = { version = "0.74.1", default-features = false }
ic-host-http = { version = "0.74.1", default-features = false }
ic-host-process = { version = "0.74.1", default-features = false }
ic-platform = { version = "0.23.0", default-features = false }
ic-platform-runtime = { version = "0.19.0", default-features = false }
ic-platform-types = { version = "0.18.0", default-features = false }
ic-storage = "0.68.0"
ic-wire = "0.17.1"
libc = "0.2.191"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"
tokio = "1.54.1"
url = "2.5.8"

# Tests and tooling only
ic-host-tools = { version = "0.83.0", default-features = false }
ic-testkit = "0.88.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# This workspace owns the standalone/probe products. Consumers keep their own
# release profiles; linking Blob does not select their optimization policy.
[profile.release]
lto = "thin"
codegen-units = 1
