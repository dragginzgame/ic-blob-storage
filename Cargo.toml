[workspace]
# Production packages: canisters/standalone and crates/*.
# Tests and tooling packages: canisters/test/*, tests/pocketic and tests/protocol.
members = [
    "canisters/standalone",
    "canisters/test/admission_probe",
    "canisters/test/authority_probe",
    "canisters/test/consumer_probe",
    "canisters/test/funding_probe",
    "canisters/test/gateway_source",
    "canisters/test/storage_probe",
    "crates/ic-blob-storage",
    "crates/ic-blob-storage-cli",
    "crates/ic-blob-storage-contracts",
    "tests/pocketic",
    "tests/protocol",
]
resolver = "3"

[workspace.package]
version = "0.33.1"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-blob-storage"
publish = ["crates-io"]

[workspace.dependencies]
# Production dependencies
candid = "0.10.36"
ciborium = "0.2.2"
hex = "0.4.3"
ic-blob-storage = { path = "crates/ic-blob-storage" }
ic-blob-storage-contracts = { path = "crates/ic-blob-storage-contracts", version = "0.33.1" }
ic-build = "0.17"
ic-cdk = "0.20"
ic-host-artifacts = "0.27"
ic-host-fs = "0.27"
ic-host-process = "0.27"
ic-memory = "0.48"
ic-platform = { version = "0.1.8", default-features = false }
ic-storage = "0.5.2"
ic-wire = "0.4"
libc = "0.2.190"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_cbor = "0.11.2"
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
# PocketIC constrains its own thiserror dependency; the lock retains 2.0.18.
thiserror = "2.0.18"
tokio = "1.53.1"
url = "2.5.8"

# Tests and tooling only
blob-test-protocol = { path = "tests/protocol" }
ic-blob-storage-canister = { path = "canisters/standalone" }
ic-host-tools = "0.27"
ic-metrics = "0.14"
ic-testkit = "0.54"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
