name: Release and formatting tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Preserve native qualification for each push; supersede only PR revisions.
  group: tooling-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare the advertised minimum compiler
        run: rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown
      - name: Prepare the locked dependency cache
        env:
          RUSTUP_TOOLCHAIN: '1.88.0'
        run: make deps
      - name: Check public consumers and workspace paths at the minimum
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
        run: make msrv-check

  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Intel cold setup and tooling fixtures used 22 minutes before native builds.
    timeout-minutes: 60
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare fixture utilities on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xz-utils libdigest-sha-perl shellcheck
      - name: Prepare fixture utilities on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep xz shellcheck
      - name: Qualify tooling evidence collection on this host
        env:
          BLOB_TOOLING_ARCHIVE_PROOF: ${{ runner.temp }}/blob-tooling-evidence-proof.current
        run: bash scripts/ci/test-tooling-evidence.sh "$BLOB_TOOLING_ARCHIVE_PROOF"
      - name: Upload the tooling archive qualification
        id: tooling-archive-proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-evidence-qualification-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blob-tooling-evidence-proof.current/evidence.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Require the uploaded tooling archive identity
        env:
          BLOB_TOOLING_ARCHIVE_ID: ${{ steps.tooling-archive-proof.outputs.artifact-id }}
        run: |
          [[ "$BLOB_TOOLING_ARCHIVE_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Missing or invalid archive identity' >&2; exit 1; }
      - name: Download that exact tooling archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.tooling-archive-proof.outputs.artifact-id }}
          path: ${{ runner.temp }}/blob-tooling-evidence-downloaded.current
          digest-mismatch: error
      - name: Verify downloaded tooling archive bytes
        env:
          BLOB_TOOLING_ARCHIVE_PROOF: ${{ runner.temp }}/blob-tooling-evidence-proof.current
          BLOB_TOOLING_ARCHIVE_DOWNLOAD: ${{ runner.temp }}/blob-tooling-evidence-downloaded.current
        run: |
          expected="$(cat "$BLOB_TOOLING_ARCHIVE_PROOF/archive.sha256")"
          bash scripts/ci/verify-file-checksum.sh sha256 "$expected" "$BLOB_TOOLING_ARCHIVE_DOWNLOAD/evidence.tar.gz"
      - name: Select the declared Rust toolchain
        run: |
          rustup show active-toolchain
      - name: Prepare and verify reviewed repository-local executables
        run: |
          make install-tools
          make tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
      - name: Check the snapshot, formatter and release/hook fixtures
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: |
          /bin/bash --version
          make shared-tooling-check
          failed=0
          for target in tools-check release-tools-check dependency-pins-check documentation-links-check shared-tooling-tests evidence-check fmt-check release-check hooks-check; do
            if make "$target"; then :; else failed=1; fi
          done
          exit "$failed"
      - name: Prepare the locked native dependency cache
        run: make deps
      - name: Qualify native CLI, installation and Metrics restoration probe
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: make test-native-host
      - name: Archive failed tooling fixtures
        id: tooling-failure
        if: failure()
        run: |
          output="$(mktemp -d "$RUNNER_TEMP/blob-tooling-evidence.XXXXXX")/evidence.tar.gz"
          archive="$(bash scripts/ci/collect-tooling-evidence.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$output")"
          if [[ -n "$archive" ]]; then printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"; fi
      - name: Retain failed tooling fixtures
        if: ${{ failure() && steps.tooling-failure.outputs.archive != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-failure-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ steps.tooling-failure.outputs.archive }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
