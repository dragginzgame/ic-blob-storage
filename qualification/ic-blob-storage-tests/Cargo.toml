[package]
name = "ic-blob-storage-tests"
version = "0.100.5"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[package.metadata.toko-tooling.loc]
category = "tests"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dev-dependencies]
ic-blob-storage.workspace = true
ic-blob-storage-enrollment-probe.workspace = true
ic-blob-storage-reference-app.workspace = true
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-platform = { workspace = true, features = ["ingress-packets"] }
ic-platform-legacy = { workspace = true, features = ["agent", "certification-cbor", "certification-verify"] }
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-testkit = { workspace = true, features = ["held-reply-fixtures"] }
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
toko-tooling.workspace = true

[[test]]
name = "callbacks"
path = "tests/callbacks/mod.rs"

[[test]]
name = "management"
path = "tests/management/mod.rs"

[lints]
workspace = true
