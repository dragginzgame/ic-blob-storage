name: Release and formatting tooling

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_group:
        description: Source-bound validation scope (normal main/PR CI stays full)
        type: choice
        default: workspace
        options: [workspace, contracts, client, engine]

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire-schema:
    name: Wire schema and generated clients
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Select the declared Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: tests/browser/.nvmrc
          package-manager-cache: false
      - name: Prepare the declared npm and locked browser dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --global "$(node -p 'require("./tests/browser/package.json").packageManager')" --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          make browser-tools-check
      - name: Prepare the declared compiler and locked Cargo dependencies
        run: |
          rustup show active-toolchain
          make deps
          make compiler-check
      # Portable Contracts regressions have one Linux owner. A manual group
      # dispatch delegates Rust tests to its source-bound plan on each host.
      - name: Qualify portable Contracts regressions
        if: github.event_name != 'workflow_dispatch' || inputs.release_group == 'workspace'
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
        run: |
          mkdir -p target/wire-schema
          cargo test --offline --locked -p ic-blob-storage-contracts --all-features 2>&1 | tee target/wire-schema/contracts.log
      - name: Qualify generated Wire clients
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
        run: |
          mkdir -p target/wire-schema
          make test-wire-schema 2>&1 | tee target/wire-schema/qualification.log
      - name: Retain generated clients and qualification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-wire-schema-${{ github.run_attempt }}
          path: target/wire-schema/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  library-tests:
    name: Core and client library regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare the declared compiler and locked Cargo dependencies
        run: |
          rustup show active-toolchain
          make deps
          make compiler-check
      - name: Check isolated public native and supported Wasm graphs
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
        run: make compiler-graphs-check
      - name: Run core and client library regressions
        if: github.event_name != 'workflow_dispatch' || inputs.release_group == 'workspace'
        id: library-tests
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
        run: |
          bash scripts/ci/run-nonempty-cargo-test.sh --offline --locked -p ic-blob-storage --lib --all-features
          bash scripts/ci/run-nonempty-cargo-test.sh --offline --locked -p ic-blob-storage-client --lib --all-features

  tooling:
    env:
      BLOB_GROUP_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.release_group != 'workspace' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Intel 0.23.1 exhausted 60 minutes in tooling, before native qualification.
    # Keep time for native checks and evidence after a bounded fixture failure.
    timeout-minutes: 120
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare fixture utilities on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xz-utils libdigest-sha-perl shellcheck
      - name: Prepare fixture utilities on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep xz shellcheck
      - name: Qualify tooling evidence collection on this host
        env:
          BLOB_TOOLING_ARCHIVE_PROOF: ${{ runner.temp }}/blob-tooling-evidence-proof.current
        run: bash scripts/ci/test-tooling-evidence.sh "$BLOB_TOOLING_ARCHIVE_PROOF"
      - name: Upload the tooling archive qualification
        id: tooling-archive-proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-evidence-qualification-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blob-tooling-evidence-proof.current/evidence.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Require the uploaded tooling archive identity
        env:
          BLOB_TOOLING_ARCHIVE_ID: ${{ steps.tooling-archive-proof.outputs.artifact-id }}
        run: |
          [[ "$BLOB_TOOLING_ARCHIVE_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Missing or invalid archive identity' >&2; exit 1; }
      - name: Download the exact uploaded tooling archive
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB_TOOLING_REPOSITORY: ${{ github.repository }}
          BLOB_TOOLING_RUN_ID: ${{ github.run_id }}
          BLOB_TOOLING_ARCHIVE_ID: ${{ steps.tooling-archive-proof.outputs.artifact-id }}
          BLOB_TOOLING_ARCHIVE_DIGEST: ${{ steps.tooling-archive-proof.outputs.artifact-digest }}
          BLOB_TOOLING_ARCHIVE_DOWNLOAD: ${{ runner.temp }}/blob-tooling-evidence-downloaded.current
        run: bash scripts/ci/download-evidence.sh "$BLOB_TOOLING_REPOSITORY" "$BLOB_TOOLING_RUN_ID" "$BLOB_TOOLING_ARCHIVE_ID" "$BLOB_TOOLING_ARCHIVE_DIGEST" "$BLOB_TOOLING_ARCHIVE_DOWNLOAD"
      - name: Retain failed evidence download attempts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-evidence-download-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blob-tooling-evidence-downloaded.current
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify downloaded tooling archive bytes
        env:
          BLOB_TOOLING_ARCHIVE_PROOF: ${{ runner.temp }}/blob-tooling-evidence-proof.current
          BLOB_TOOLING_ARCHIVE_DOWNLOAD: ${{ runner.temp }}/blob-tooling-evidence-downloaded.current
        run: |
          expected="$(cat "$BLOB_TOOLING_ARCHIVE_PROOF/archive.sha256")"
          bash scripts/ci/verify-file-checksum.sh sha256 "$expected" "$BLOB_TOOLING_ARCHIVE_DOWNLOAD/evidence.tar.gz"
      - name: Select the declared Rust toolchain
        run: |
          rustup show active-toolchain
      - name: Prepare and verify reviewed repository-local executables
        run: |
          make install-tools
          make tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
      - name: Prepare the locked workspace cache before offline admission
        run: |
          make deps
          make compiler-check
      - name: Select native compatibility checks against the complete release delta
        id: compatibility
        env:
          RELEASE_GROUP: ${{ inputs.release_group != 'workspace' && inputs.release_group || 'client' }}
        run: |
          export RELEASE_SOURCE="$(git rev-parse HEAD)"
          mkdir -p target/compatibility
          perl scripts/release/validation.pl plan target/compatibility/plan.json
          jq -er '
            "release=" + ((.scope == "workspace") | tostring),
            "optimizer=" + ([.stages[] | select(.target == "test-pocketic") | (.required and (.reason | contains("test-pocketic-engine-run")))][0] | tostring),
            "archive=" + ([.stages[] | select(.target == "package-regression") | .required][0] | tostring)
          ' target/compatibility/plan.json >> "$GITHUB_OUTPUT"
      - name: Run the selected source-bound group plan on this native host
        if: env.BLOB_GROUP_CI == 'true'
        env:
          RELEASE_GROUP: ${{ inputs.release_group }}
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: |
          export RELEASE_SOURCE="$(git rev-parse HEAD)"
          make release-verify
      - name: Retain group plans, package scopes and stage execution evidence
        if: always() && env.BLOB_GROUP_CI == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-group-${{ inputs.release_group }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            target/blob-release-validation.*/
            target/release-stage-cache/candidates/attempts/*/projection.json
            target/release-stage-cache/candidates/attempts/*/preparation.log
            target/release-stage-cache/execution/attempts/*/*.json
            target/release-stage-cache/execution/attempts/*/*.stdout
            target/release-stage-cache/execution/attempts/*/*.stderr
            target/release-stage-cache/execution/proofs/*.json
            .git/release-state/validation/
            .git/release-state/validation-failures/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Check the snapshot, formatter and release/hook fixtures
        if: env.BLOB_GROUP_CI != 'true'
        timeout-minutes: 45
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: |
          /bin/bash --version
          make shared-tooling-check
          failed=0
          for target in tools-check release-tools-check dependency-pins-check documentation-links-check shared-tooling-tests evidence-check fmt-check release-metadata-check hooks-check; do
            if make "$target"; then :; else failed=1; fi
          done
          exit "$failed"
      - name: Qualify changed or uncertain release infrastructure on Linux
        if: env.BLOB_GROUP_CI != 'true' && runner.os == 'Linux' && (steps.compatibility.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: |
          make release-check
          bash scripts/ci/test-release-stage-reuse.sh
      - name: Run the existing Clippy gate before archive qualification
        if: env.BLOB_GROUP_CI != 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
        run: make clippy
      - name: Qualify changed or uncertain archive-verifier contracts
        if: env.BLOB_GROUP_CI != 'true' && steps.compatibility.outputs.archive != 'false'
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: make package-regression
      - name: Qualify mixed-version library archives on this host
        if: env.BLOB_GROUP_CI != 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: make package
      - name: Retain mixed-version archive qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-packages-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            target/package/*.crate
            target/package/blob-verification.*/**
            target/package-fixture.*/**
            !target/package/blob-verification.*/target/**
            !target/package-fixture.*/target/debug/**
            !target/package-fixture.*/target/release/**
            !target/package-fixture.*/target/package/blob-verification.*/target/**
            !target/package-fixture.*/refusal-*/target/debug/**
            !target/package-fixture.*/refusal-*/target/release/**
            !target/package-fixture.*/refusal-*/target/package/blob-verification.*/target/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      # The group plan already owns CLI tests and both installed partitions,
      # including any justified exclusions. Do not append the broad host target.
      - name: Qualify native CLI, installation and restoration read-cost probe
        if: env.BLOB_GROUP_CI != 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: make test-native-host
      - name: Qualify original and optimized Blob Wasm installation and restoration
        if: runner.os == 'Linux' && (steps.compatibility.outputs.optimizer == 'true' || (github.event_name == 'workflow_dispatch' && env.BLOB_GROUP_CI != 'true'))
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          TMPDIR: ${{ runner.temp }}
        run: make test-wasm-opt
      - name: Retain Blob Wasm optimizer qualification
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-wasm-opt-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            target/blob-wasm-opt.*
            target/compatibility/
          if-no-files-found: ignore
          retention-days: 30
      - name: Archive failed tooling fixtures
        id: tooling-failure
        if: ${{ failure() || cancelled() }}
        run: |
          output="$(mktemp -d "$RUNNER_TEMP/blob-tooling-evidence.XXXXXX")/evidence.tar.gz"
          status=0
          archive="$(bash scripts/ci/collect-tooling-evidence.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$output")" || status=$?
          complete=true
          [[ "$status" == 0 ]] || complete=false
          printf 'collection-complete=%s\n' "$complete" >> "$GITHUB_OUTPUT"
          if [[ -n "$archive" ]]; then printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"; fi
      - name: Retain failed tooling fixtures
        if: ${{ (failure() || cancelled()) && steps.tooling-failure.outputs.archive != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-failure-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ steps.tooling-failure.outputs.archive }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Check tooling evidence completeness
        if: ${{ (failure() || cancelled()) && steps.tooling-failure.outputs.collection-complete == 'false' }}
        run: |
          echo 'Tooling evidence collection was incomplete; safe admitted evidence was retained when available.' >&2
          exit 1
