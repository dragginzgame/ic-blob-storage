[workspace]
members = [
    "ic-blob-storage-callback-probe",
    "ic-blob-storage-enrollment-probe",
    "ic-blob-storage-reply-probe",
    "ic-blob-storage-tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ic-blob-storage = { path = "../crates/ic-blob-storage" }
ic-blob-storage-enrollment-probe = { path = "ic-blob-storage-enrollment-probe" }
ic-blob-storage-reference-app = { path = "../crates/ic-blob-storage-reference-app" }
ic-host-fs = { version = "0.79.0", default-features = false }
ic-platform = { version = "0.33.3", default-features = false }
ic-platform-runtime = { version = "0.22.3", default-features = false }
ic-platform-types = { version = "0.20.3", default-features = false }
ic-storage = "0.74.1"
ic-testkit = { version = "0.106.0", default-features = false }
ic-wire = { version = "0.24.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }
# Source tooling only; same selected payload as the product workspace.
toko-tooling = "=0.44.4"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
