[package]
name = "ic-blob-storage-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "blob-storage"
path = "src/main.rs"

[[bin]]
name = "caffeine-probe"
path = "src/probe_main.rs"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
candid.workspace = true
ic-blob-storage = { path = "../ic-blob-storage" }
ic-agent = { version = "=0.49.2", default-features = false, features = ["pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json.workspace = true
serde.workspace = true
tokio = { version = "1.53.1", features = ["rt", "time"] }
url = "2.5.8"
sha2.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
