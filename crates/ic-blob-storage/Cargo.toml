[package]
name = "ic-blob-storage"
version = "0.74.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Independent blob-storage service library for Internet Computer canisters"
readme = "../../README.md"

[features]
# Non-default heap reference owners and isolated probe/fault-injection access.
test-support = ["ic-storage/test-support"]

[dependencies]
ic-blob-storage-contracts = { workspace = true, features = ["caffeine-candid"] }
ic-platform = { workspace = true, features = ["candid", "runtime", "management-canister-types"] }
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
ic-platform = { workspace = true, features = ["principal-self-authenticating"] }
ic-storage = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[[test]]
name = "lifecycle_binding"
required-features = ["test-support"]
