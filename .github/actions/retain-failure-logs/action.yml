name: Retain bounded Blob CI diagnostics
description: Select sanitized Blob logs and delegate archive upload to the installed Toko action.
inputs:
  name:
    description: Job-specific artifact name.
    required: true
runs:
  using: composite
  steps:
    - id: prepare
      if: always()
      shell: bash
      run: |
        directory="$(mktemp -d "$RUNNER_TEMP/blob-ci-upload.XXXXXX")"
        export BLOB_UPLOAD_DIRECTORY="$directory"
        printf 'archive=%s/evidence.tar.gz\nlog=%s/collection.log\n' "$directory" "$directory" >> "$GITHUB_OUTPUT"
        status=0
        bash -e -o pipefail > "$directory/collection.log" 2>&1 <<'BLOB_EVIDENCE' || status=$?
        evidence="$RUNNER_TEMP/blob-ci-evidence"
        [[ -d "$evidence" && ! -L "$evidence" ]] || {
          echo 'Failure evidence directory is missing or redirected.' >&2
          exit 1
        }
        paths=()
        for phase in admit workflow-setup workflow-and-secrets linux-setup linux-checks macos-setup macos-checks; do
          path="$evidence/$phase.txt"
          if [[ -e "$path" || -L "$path" ]]; then
            [[ -f "$path" && ! -L "$path" && "$(wc -c < "$path")" -le 67000 ]] || {
              echo 'Failure evidence is not a bounded regular diagnostic file.' >&2
              exit 1
            }
            paths+=("$evidence" "$phase.txt")
          fi
        done
        [[ ${#paths[@]} -gt 0 ]] || { echo 'Failure evidence is missing.' >&2; exit 1; }
        bash vendor/toko-tooling/scripts/ci/archive-evidence.sh \
          "$BLOB_UPLOAD_DIRECTORY/evidence.partial.tar.gz" "${paths[@]}"
        mv "$BLOB_UPLOAD_DIRECTORY/evidence.partial.tar.gz" "$BLOB_UPLOAD_DIRECTORY/evidence.tar.gz"
        BLOB_EVIDENCE
        cat "$directory/collection.log"
        exit "$status"
    - id: upload
      if: always()
      uses: ./vendor/toko-tooling/.github/actions/retain-failure-evidence
      with:
        name: ${{ inputs.name }}
        prepared-archive: ${{ steps.prepare.outputs.archive }}
        collection-log: ${{ steps.prepare.outputs.log }}
    - id: report
      if: always()
      shell: bash
      env:
        PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
      run: |
        linked=false
        if [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$ARTIFACT_ID"
          printf 'Failure evidence: %s\n' "$url"
          printf '[Sanitized failure evidence](%s) (14-day retention).\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          linked=true
        fi
        if [[ "$PREPARE_OUTCOME" != success || "$UPLOAD_OUTCOME" != success || "$linked" != true ]]; then
          echo 'Failure evidence collection/upload failed or evidence is missing; inspect the original failed step.' >&2
          echo 'Failure evidence collection/upload failed or evidence is missing.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
