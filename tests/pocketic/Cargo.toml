[package]
license.workspace = true
name = "ic-blob-storage-pocketic-tests"
version = "0.70.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
blob-test-protocol.workspace = true
ic-blob-storage-contracts = { workspace = true, features = ["caffeine-candid", "provider-json"] }
ic-platform = { workspace = true, features = ["candid"] }
ic-testkit.workspace = true
serde.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
hex.workspace = true
ic-blob-storage.workspace = true
ic-blob-storage-canister.workspace = true
ic-host-artifacts = { workspace = true, features = ["gzip", "wasm"] }
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
ic-host-tools = { workspace = true, features = ["ic-interface"] }
ic-platform = { workspace = true, features = ["agent", "candid-parser", "certification"] }
ic-wire.workspace = true
reqwest.workspace = true
serde_cbor.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[lints]
workspace = true
