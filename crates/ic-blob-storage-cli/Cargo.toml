[package]
name = "ic-blob-storage-cli"
autobins = false
version.workspace = true
description = "Blob storage inspection, offline preparation and guarded maintenance CLI for the Internet Computer"
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[[bin]]
name = "blob"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ic-blob-storage.workspace = true
ic-blob-storage-reference-app.workspace = true
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-platform = { workspace = true, features = ["ingress-packets", "native-signed"] }
ic-platform-protocol = { workspace = true, features = ["caffeine", "management"] }
ic-platform-types.workspace = true
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
