[package]
name = "ic-blob-storage"
version.workspace = true
description = "Experimental blob authorization, application references and provider-obligation accounting for the Internet Computer"
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = ["persistence"]
persistence = ["dep:ic-storage", "dep:postcard"]
caffeine-certificate = ["dep:ic-platform-protocol"]
logging = ["dep:ic-logging"]
metrics = ["dep:ic-metrics"]

[dependencies]
ic-logging = { workspace = true, optional = true }
ic-metrics = { workspace = true, optional = true }
ic-platform-protocol = { workspace = true, features = ["caffeine"], optional = true }
ic-platform-types.workspace = true
ic-storage = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
