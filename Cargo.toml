[workspace]
members = ["crates/ic-blob-storage", "canisters/test/authority_probe", "canisters/test/gateway_source", "tests/protocol", "tests/pocketic"]
resolver = "3"

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-blob-storage"
publish = ["crates-io"]

[workspace.dependencies]
candid = "0.10.36"
ic-cdk = "0.20.3"
ic-stable-structures = "=0.7.2"
ic-testkit = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
# PocketIC 16 requires this exact compatible release.
thiserror = "=2.0.18"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
