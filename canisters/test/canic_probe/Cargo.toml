[workspace]
# Required by published Canic host validation; the library workspace keeps resolver 3.
resolver = "2"

[workspace.dependencies]
canic = { version = "=0.110.48", default-features = false, features = [] }

[package]
name = "blob-canic-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[package.metadata.canic]
app = "blob_canic_probe"
role = "storage"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
canic = { workspace = true, features = [] }
candid = "0.10.36"
serde = { version = "1.0.229", features = ["derive"] }
ic-cdk = "0.20.3"
ic-blob-storage = { path = "../../../crates/ic-blob-storage" }
ic-blob-storage-canic = { path = "../../../crates/ic-blob-storage-canic" }

[build-dependencies]
canic = { workspace = true, features = [] }

[lints.rust]
missing_docs = "deny"
# Canic/ctor generated registration uses its own narrow unsafe allowance.
# Deny handwritten unsafe while allowing the maintained framework expansions.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
