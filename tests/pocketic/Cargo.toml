[[bin]]
name = "blob-fixture-funding-lookup"
path = "src/bin/blob_fixture_funding_lookup/main.rs"

[[bin]]
name = "blob-fixture-funding-preview"
path = "src/bin/blob_fixture_funding_preview/main.rs"

[[bin]]
